<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPRA Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>EPRA Demo</h1>
      <p class="subtitle">Structure-first Energetic Paradigm analysis</p>
    </header>

    <main class="layout">
      <section class="card input-card">
        <label for="prompt" class="label">Enter a question or system to analyze</label>
        <textarea id="prompt" rows="6" placeholder="Analyze the airport security screening system with Energetic Paradigm."></textarea>

        <div class="example-row">
          <span class="example-label">Examples:</span>
          <button class="example-btn" data-example="Analyze the airport security screening system with Energetic Paradigm.">Airport security</button>
          <button class="example-btn" data-example="Analyze the university admissions system with Energetic Paradigm.">University admissions</button>
          <button class="example-btn" data-example="Analyze the hospital triage system with Energetic Paradigm.">Hospital triage</button>
          <button class="example-btn" data-example="Analyze the search ranking system with Energetic Paradigm.">Search ranking</button>
        </div>

        <div class="action-row">
          <button id="submitBtn" class="primary-btn">Run EP Analysis</button>
          <button id="clearBtn" class="secondary-btn">Clear</button>
        </div>

        <div id="status" class="status idle">Ready</div>
      </section>

      <section class="card output-card">
        <div class="topline">
          <h2>Result</h2>
          <div class="badge-row">
            <span id="modeBadge" class="badge neutral">mode: —</span>
            <span id="validityBadge" class="badge neutral">No result</span>
            <span id="sourceBadge" class="badge neutral">validation: —</span>
          </div>
        </div>

        <div id="analysis" class="analysis empty">
          Submit a prompt to see the EPRA output.
        </div>

        <div class="meta-grid">
          <div class="meta-card">
            <div class="meta-title">Task System</div>
            <div id="taskSystem" class="meta-value">—</div>
          </div>
          <div class="meta-card">
            <div class="meta-title">Active Forms</div>
            <div id="activeForms" class="meta-value">—</div>
          </div>
        </div>

        <details class="detail-block">
          <summary>Canonical Setup</summary>
          <pre id="canonicalSetup">—</pre>
        </details>

        <details class="detail-block">
          <summary>Structural Commitments</summary>
          <pre id="structuralCommitments">—</pre>
        </details>

        <details class="detail-block">
          <summary>Validation Gates</summary>
          <pre id="validationGates">—</pre>
        </details>

        <details class="detail-block">
          <summary>Full Response JSON</summary>
          <pre id="fullJson">—</pre>
        </details>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
